<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Geoapify 旅行地圖測試 v3</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#18202a; background:#f6f7f9; }
    * { box-sizing:border-box; }
    body { margin:0; }
    .wrap { max-width:900px; margin:0 auto; padding:16px; }
    h1 { font-size:22px; margin:4px 0 8px; }
    p { line-height:1.5; color:#56606b; }
    .panel { background:#fff; border:1px solid #dde2e7; border-radius:16px; padding:14px; margin-bottom:12px; }
    label { display:block; font-weight:700; margin-bottom:6px; }
    input,button,select { font:inherit; min-height:46px; border-radius:12px; }
    input,select { width:100%; border:1px solid #cfd6dd; padding:0 12px; font-size:16px; background:#fff; }
    button { border:0; padding:0 16px; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.45; cursor:default; }
    .primary { background:#18202a; color:#fff; }
    .secondary { background:#eef1f4; color:#18202a; }
    .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
    .row>* { flex:1 1 150px; }
    #map { height:520px; width:100%; border-radius:16px; overflow:hidden; background:#e8ecef; }
    .status { padding:10px 12px; border-radius:12px; background:#f1f4f6; margin-top:10px; font-size:14px; }
    .small { font-size:13px; color:#6b747e; }
    .day-marker { width:38px; height:38px; border-radius:50%; background:#fff; color:#111; border:3px solid #111; display:grid; place-items:center; font-weight:800; box-shadow:0 2px 8px rgba(0,0,0,.2); }
    .via-marker { width:24px; height:24px; border-radius:50%; background:#fff; color:#111; border:2px solid #666; display:grid; place-items:center; font-size:11px; font-weight:800; box-shadow:0 2px 6px rgba(0,0,0,.18); }
    .via-list { display:grid; gap:8px; margin-top:10px; }
    .via-item { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; padding:10px 12px; border:1px solid #dde2e7; border-radius:12px; background:#fafbfc; }
    .via-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; }
    .via-actions { display:flex; gap:6px; }
    .via-actions button { min-width:42px; min-height:38px; padding:0 10px; border-radius:10px; background:#eef1f4; color:#18202a; }
    @media(max-width:600px){ .wrap{padding:10px;} #map{height:500px;} }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Geoapify 旅行地圖測試 v3</h1>
  <p>新增「中途經過點」：D1、D2 放好後，可加入最多 3 個經過點，並刪除或調整順序。</p>

  <div class="panel">
    <label for="apiKey">1. 貼上你的 Geoapify API key</label>
    <input id="apiKey" type="password" autocomplete="off" placeholder="貼上 API key">
    <div class="row"><button id="startBtn" class="primary">啟動地圖</button></div>
    <div class="small">API key 只留在目前頁面的記憶體，不會儲存。</div>
  </div>

  <div class="panel">
    <label for="modeSelect">2. 搜尋後要做什麼</label>
    <select id="modeSelect" disabled>
      <option value="day">放成 D1 / D2</option>
      <option value="via">加入經過點</option>
    </select>

    <label for="searchBox" style="margin-top:12px;">3. 搜尋地點</label>
    <input id="searchBox" type="search" placeholder="例如 Hamilton, New Zealand" disabled>

    <div class="row">
      <button id="searchBtn" class="primary" disabled>搜尋</button>
      <button id="clearBtn" class="secondary" disabled>全部清除</button>
    </div>

    <div id="status" class="status">先貼上 API key，再按「啟動地圖」。</div>
  </div>

  <div class="panel" id="viaPanel" hidden>
    <strong>中途經過點</strong>
    <div class="small" style="margin-top:4px;">最多 3 個。↑ ↓ 可調整順序，× 可刪除。</div>
    <div id="viaList" class="via-list"></div>
  </div>

  <div id="map" aria-label="旅行地圖"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let map, tileLayer, routeLayer = null, searchMarker = null;
let apiKey = "";
let dayPoints = [];
let viaPoints = [];

const apiKeyInput = document.getElementById("apiKey");
const startBtn = document.getElementById("startBtn");
const modeSelect = document.getElementById("modeSelect");
const searchBox = document.getElementById("searchBox");
const searchBtn = document.getElementById("searchBtn");
const clearBtn = document.getElementById("clearBtn");
const statusEl = document.getElementById("status");
const viaPanel = document.getElementById("viaPanel");
const viaList = document.getElementById("viaList");

function setStatus(t){ statusEl.textContent=t; }

function makeDayIcon(day){
  return L.divIcon({
    className:"",
    html:'<div class="day-marker">D'+day+'</div>',
    iconSize:[38,38],
    iconAnchor:[19,19]
  });
}

function makeViaIcon(index){
  return L.divIcon({
    className:"",
    html:'<div class="via-marker">'+(index+1)+'</div>',
    iconSize:[24,24],
    iconAnchor:[12,12]
  });
}

function initMap(){
  if(!map) map=L.map("map").setView([-36.8485,174.7633],10);
  if(tileLayer) map.removeLayer(tileLayer);

  tileLayer=L.tileLayer(
    "https://maps.geoapify.com/v1/tile/osm-bright/{z}/{x}/{y}.png?apiKey="+encodeURIComponent(apiKey),
    {maxZoom:20, attribution:"Powered by Geoapify | © OpenStreetMap contributors"}
  ).addTo(map);

  modeSelect.disabled=false;
  searchBox.disabled=false;
  searchBtn.disabled=false;
  clearBtn.disabled=false;
  updateModeAvailability();
  setStatus("地圖已啟動。先放 D1、D2。");
  setTimeout(()=>map.invalidateSize(),100);
}

async function geocode(q){
  const params=new URLSearchParams({text:q,limit:"1",apiKey:apiKey});
  const res=await fetch("https://api.geoapify.com/v1/geocode/search?"+params.toString());
  if(!res.ok) throw new Error("Geocoding HTTP "+res.status);
  const data=await res.json();
  return data.features && data.features.length ? data.features[0] : null;
}

function visiblePosition(lat,lon,day){
  const base=L.latLng(lat,lon);
  if(day===2 && dayPoints.length===1){
    const d=map.distance([dayPoints[0].lat,dayPoints[0].lon],[lat,lon]);
    if(d<30){
      const pixel=map.project(base,map.getZoom());
      return map.unproject(L.point(pixel.x+26,pixel.y-18),map.getZoom());
    }
  }
  return base;
}

function updateModeAvailability(){
  if(dayPoints.length<2){
    modeSelect.value="day";
    modeSelect.querySelector('option[value="via"]').disabled=true;
  }else{
    modeSelect.querySelector('option[value="via"]').disabled=false;
  }
}

function addDayPoint(lat,lon,label){
  if(dayPoints.length>=2){
    setStatus("D1、D2 已放好。若要指定中途路線，請切換成「加入經過點」。");
    return;
  }

  const day=dayPoints.length+1;
  const shown=visiblePosition(lat,lon,day);
  const marker=L.marker(shown,{icon:makeDayIcon(day),draggable:true}).addTo(map);
  marker.bindPopup("<strong>D"+day+"</strong><br>"+label);

  const item={lat,lon,label,marker};
  dayPoints.push(item);

  marker.on("dragend",async()=>{
    const p=marker.getLatLng();
    item.lat=p.lat;
    item.lon=p.lng;
    if(dayPoints.length===2) await redrawRouteSafe();
  });

  updateModeAvailability();

  if(dayPoints.length===1){
    setStatus("D1 已放好。再搜尋第二個住宿點放 D2。");
  }else{
    modeSelect.value="via";
    setStatus("D2 已放好。現在可搜尋城鎮或景點，加入中途經過點。");
    redrawRouteSafe();
  }
}

function renderViaList(){
  viaList.innerHTML="";
  viaPanel.hidden=viaPoints.length===0;

  viaPoints.forEach((v,i)=>{
    v.marker.setIcon(makeViaIcon(i));

    const row=document.createElement("div");
    row.className="via-item";

    const name=document.createElement("div");
    name.className="via-name";
    name.textContent=(i+1)+". "+v.label;

    const actions=document.createElement("div");
    actions.className="via-actions";

    const up=document.createElement("button");
    up.type="button";
    up.textContent="↑";
    up.disabled=i===0;
    up.addEventListener("click",async()=>{
      const tmp=viaPoints[i-1];
      viaPoints[i-1]=viaPoints[i];
      viaPoints[i]=tmp;
      renderViaList();
      await redrawRouteSafe();
    });

    const down=document.createElement("button");
    down.type="button";
    down.textContent="↓";
    down.disabled=i===viaPoints.length-1;
    down.addEventListener("click",async()=>{
      const tmp=viaPoints[i+1];
      viaPoints[i+1]=viaPoints[i];
      viaPoints[i]=tmp;
      renderViaList();
      await redrawRouteSafe();
    });

    const del=document.createElement("button");
    del.type="button";
    del.textContent="×";
    del.addEventListener("click",async()=>{
      map.removeLayer(viaPoints[i].marker);
      viaPoints.splice(i,1);
      renderViaList();
      await redrawRouteSafe();
    });

    actions.append(up,down,del);
    row.append(name,actions);
    viaList.append(row);
  });
}

function addViaPoint(lat,lon,label){
  if(dayPoints.length<2){
    setStatus("請先放好 D1、D2，再加入經過點。");
    return;
  }
  if(viaPoints.length>=3){
    setStatus("目前測試版最多 3 個中途經過點。");
    return;
  }

  const marker=L.marker([lat,lon],{icon:makeViaIcon(viaPoints.length),draggable:true}).addTo(map);
  marker.bindPopup("<strong>經過點</strong><br>"+label);

  const item={lat,lon,label,marker};
  viaPoints.push(item);

  marker.on("dragend",async()=>{
    const p=marker.getLatLng();
    item.lat=p.lat;
    item.lon=p.lng;
    await redrawRouteSafe();
  });

  renderViaList();
  setStatus("已加入經過點："+label);
  redrawRouteSafe();
}

function buildRoutePoints(){
  if(dayPoints.length<2) return [];
  return [dayPoints[0],...viaPoints,dayPoints[1]];
}

async function drawRoute(){
  const routePoints=buildRoutePoints();
  if(routePoints.length<2) return;

  if(routeLayer){
    map.removeLayer(routeLayer);
    routeLayer=null;
  }

  const first=routePoints[0];
  const last=routePoints[routePoints.length-1];
  const allSame=routePoints.every(p=>map.distance([first.lat,first.lon],[p.lat,p.lon])<30);

  if(allSame){
    setStatus("D1、D2 是同一住宿地點，不需要畫開車路線。");
    return;
  }

  const waypointValue=routePoints.map(p=>p.lat+","+p.lon).join("|");
  const params=new URLSearchParams({
    waypoints:waypointValue,
    mode:"drive",
    apiKey:apiKey
  });

  setStatus("正在依照 D1 → 經過點 → D2 重新計算道路路線…");

  const res=await fetch("https://api.geoapify.com/v1/routing?"+params.toString());
  if(!res.ok){
    let detail="";
    try{
      const body=await res.text();
      detail=body ? "："+body.slice(0,140) : "";
    }catch(e){}
    throw new Error("Routing HTTP "+res.status+detail);
  }

  const data=await res.json();
  if(!data.features || !data.features.length){
    setStatus("Geoapify 沒有回傳可用的開車路線，但地點資料都已保留。");
    return;
  }

  routeLayer=L.geoJSON(data,{
    style:{color:"#ffffff",weight:7,opacity:0.95}
  }).addTo(map);

  const bounds=routeLayer.getBounds();
  if(bounds.isValid()) map.fitBounds(bounds,{padding:[35,35]});

  const viaText=viaPoints.length ? "，經過 "+viaPoints.map(v=>v.label).join(" → ") : "";
  setStatus("成功：D1"+viaText+" → D2 已重新產生道路路線。");
}

async function redrawRouteSafe(){
  try{ await drawRoute(); }
  catch(err){ setStatus("路線產生失敗："+err.message); }
}

async function doSearch(){
  const q=searchBox.value.trim();
  if(!q){
    setStatus("請先輸入地名。");
    return;
  }

  try{
    setStatus("正在搜尋「"+q+"」…");
    const feature=await geocode(q);

    if(!feature){
      setStatus("找不到這個地點，請換個寫法再試。");
      return;
    }

    const lon=feature.geometry.coordinates[0];
    const lat=feature.geometry.coordinates[1];
    const name=feature.properties.formatted || q;

    map.setView([lat,lon],14);

    if(searchMarker){
      map.removeLayer(searchMarker);
      searchMarker=null;
    }

    searchMarker=L.circleMarker([lat,lon],{
      radius:9,
      weight:3,
      fillOpacity:.75
    }).addTo(map);

    const mode=modeSelect.value;
    let actionText="";

    if(mode==="day"){
      actionText="放成 D"+(dayPoints.length+1);
    }else{
      actionText="加入經過點";
    }

    searchMarker.bindPopup(
      '<strong>'+name+'</strong><br>'+
      '<button id="addHereBtn" style="margin-top:8px;padding:8px 12px;">'+actionText+'</button>'
    ).openPopup();

    setTimeout(()=>{
      const btn=document.getElementById("addHereBtn");
      if(btn){
        btn.addEventListener("click",()=>{
          if(searchMarker){
            map.removeLayer(searchMarker);
            searchMarker=null;
          }

          if(mode==="day"){
            addDayPoint(lat,lon,name);
          }else{
            addViaPoint(lat,lon,name);
          }
        },{once:true});
      }
    },0);

    setStatus("找到地點。按地圖卡片裡的「"+actionText+"」。");

  }catch(err){
    setStatus("搜尋失敗："+err.message);
  }
}

startBtn.addEventListener("click",()=>{
  apiKey=apiKeyInput.value.trim();
  if(!apiKey){
    setStatus("請先貼上 API key。");
    return;
  }
  initMap();
});

searchBtn.addEventListener("click",doSearch);

searchBox.addEventListener("keydown",(e)=>{
  if(e.key==="Enter" && !searchBtn.disabled){
    e.preventDefault();
    doSearch();
  }
});

clearBtn.addEventListener("click",()=>{
  dayPoints.forEach(p=>map.removeLayer(p.marker));
  viaPoints.forEach(p=>map.removeLayer(p.marker));
  dayPoints=[];
  viaPoints=[];

  if(routeLayer){
    map.removeLayer(routeLayer);
    routeLayer=null;
  }

  if(searchMarker){
    map.removeLayer(searchMarker);
    searchMarker=null;
  }

  viaPanel.hidden=true;
  viaList.innerHTML="";
  updateModeAvailability();
  setStatus("已全部清除。請重新放 D1、D2。");
});
</script>
</body>
</html>
